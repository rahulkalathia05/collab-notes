# CollabNotes — local development docker-compose
#
# Quick start:
#   cp backend/.env.example backend/.env   # fill in SECRET_KEY, OPENAI_API_KEY
#   docker compose up --build
#
# Ports exposed to the host:
#   http://localhost:3010   — Next.js frontend (hot-reload)
#   http://localhost:8002   — FastAPI backend  (hot-reload via uvicorn --reload)
#   localhost:5433          — PostgreSQL       (use any DB client)
#   localhost:6380          — Redis
#
# Non-standard host ports (5433 / 6380) avoid conflicts with local services.
# Inside the Docker network, services talk to each other on standard ports.

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabnotes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collabnotes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collabnotes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collabnotes-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # "development" stage: deps installed, no source COPY — source comes
      # from the bind mount below so uvicorn --reload picks up file changes.
      target: development
    container_name: collabnotes-backend
    ports:
      - "8002:8002"
    # docker-compose environment takes precedence over env_file.
    # DATABASE_URL / REDIS_URL use service names (internal Docker network).
    # All other vars (SECRET_KEY, OPENAI_API_KEY, …) come from backend/.env.
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/collabnotes
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3010"]'
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount source for hot-reload. Python packages live in
      # /usr/local/lib (system site-packages), not in /app, so they are
      # unaffected by this mount.
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # "development" stage: node_modules are baked into the image.
      # The anonymous volume below keeps the container's node_modules
      # visible even when the full source directory is bind-mounted.
      target: development
    container_name: collabnotes-frontend
    ports:
      - "3010:3010"
    environment:
      # NEXT_PUBLIC_* vars are inlined into browser JS at build time by Next.
      # These values must be reachable from the user's browser, not from
      # inside Docker — so localhost:8002 is correct (port is exposed to host).
      NEXT_PUBLIC_API_URL: http://localhost:8002
      NEXT_PUBLIC_WS_URL: ws://localhost:8002
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Bind-mount source for hot-reload
      - ./frontend:/app
      # Anonymous volume: shadows /app/node_modules with the container's copy.
      # Prevents the host's macOS/Windows node_modules from being used inside
      # the Linux container (wrong native binaries → @swc/helpers error).
      - /app/node_modules
      # Named volume for .next build cache — speeds up successive dev starts
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      # Next.js dev server compiles on first start; allow generous warm-up time
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_next:
